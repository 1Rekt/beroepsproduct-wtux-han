<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="../css/style.css" rel="stylesheet">
        <link href="../css/custom.css" rel="stylesheet">
        <title>Gelre Airport - Inchecken</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="container">
                    <ul>
                        <li><a href="../index.html">Gelre Airport!</a></li>
                        <li><a href="../passagier/index.html">Passagier</a></li>
                        <li><a href="index.html">Medewerker</a></li>
                        <li><a href="nieuwe-vlucht.html">Nieuwe vlucht</a></li>
                        <li><a href="nieuwe-passagier.html">Nieuwe passagier</a></li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <section class="overview">
                <div class="container">
                    <div class="header">
                        <h1>KL6611 naar <span>Houston</span></h1>
                        <img src="../images/vliegtuig.jpeg" alt="Foto van vliegtuig">
                    </div>
                    <div class="body">
                        <h2>Vertrek</h2>
                        <div class="items-grid">
                            <div class="item">
                                <div class="title">
                                    Datum
                                </div>
                                <div class="content">
                                    10 Nov.
                                </div>
                            </div>
                            <div class="item">
                                <div class="title">
                                    Tijd
                                </div>
                                <div class="content">
                                    16:40
                                </div>
                            </div>
                            <div class="item">
                                <div class="title">
                                    Check-in balie
                                </div>
                                <div class="content">
                                    9
                                </div>
                            </div>
                            <div class="item">
                                <div class="title">
                                    Gate
                                </div>
                                <div class="content">
                                    E22
                                </div>
                            </div>
                        </div>

                        <h2>Aankomst</h2>
                        <div class="items-grid">
                            <div class="item">
                                <div class="title">
                                    Datum
                                </div>
                                <div class="content">
                                    11 Nov.
                                </div>
                            </div>
                            <div class="item">
                                <div class="title">
                                    Tijd
                                </div>
                                <div class="content">
                                    10:35
                                </div>
                            </div>
                            <div class="item">
                                <div class="title">
                                    Aankomsthal
                                </div>
                                <div class="content">
                                    6
                                </div>
                            </div>
                            <div class="item">
                                <div class="title">
                                    Baggageband
                                </div>
                                <div class="content">
                                    12
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="luggage-checkin">
                <div class="container">
                    <div class="header">
                        <h2>Baggage inchecken</h2>
                    </div>
                    <div class="body">
                        <form method="GET" action="inchecken.html"><!-- hier hoort eigenlijk POST maar dat geeft 405 zonder php -->
                            <div class="form-item">
                                <label for="luggage">Koffers:</label>
                                <input type="number" name="luggage" id="luggage">
                            </div>
                            <div class="form-item">
                                <label for="person">Persoon:</label>
                                <select id="person" name="person">
                                    <option>Jurre</option>
                                    <option>Hans</option>
                                    <option>Tom</option>
                                </select>
                            </div>
                            <button class="btn btn-green" type="submit">Inchecken</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="container">
                <ul>
                    <li>Jurre de Klijn @ HAN</li>
                </ul>
            </div>
        </footer>
    </body>
</html>
