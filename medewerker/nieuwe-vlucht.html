        <link href="../css/style.css" rel="stylesheet">

    <body>
        <header>
            <nav>
                <div class="container">
                    <ul>
                        <li><a href="../index.html">Gelre Airport!</a></li>
                        <li><a href="../passagier/index.html">Passagier</a></li>

            </nav>
        </header>
        <main>
            <section class="page-header">
                <div class="container">
                    <h1>Nieuwe vlucht</h1>
                </div>
            </section>

            <div class="create-form">
                <div class="container">
                    <form method="GET" action="nieuwe-vlucht.html"><!-- hier hoort eigenlijk POST maar dat geeft 405 zonder php -->
                        <div class="form-item">
                            <label for="vluchtnummer">Vluchtnummer:</label>
                            <input type="text" name="vluchtnummer" id="vluchtnummer">
                        </div>

                        <div class="form-item">
                            <label for="naar">Naar:</label>
                            <input type="text" name="naar" id="naar">
                        </div>

                        <div class="form-item">
                            <label for="datum">Datum:</label>
                            <input type="date" name="datum" id="datum">
                        </div>

                        <div class="form-item">
                            <label for="checkin">Check-in balie:</label>
                            <input type="text" name="checkin" id="checkin">
                        </div>

                        <div class="form-item">
                            <label for="gate">Gate</label>
                            <input type="text" name="gate" id="gate">
                        </div>

                        <button class="btn btn-green" type="submit">Aanmaken</button>
                    </form>
                </div>
            </div>
        </main>
        <footer>
            <div class="container">
                <ul>
                    <li>Jurre de Klijn @ HAN</li>
                </ul>
