            <div class="create-form">

                        <div class="form-item">
                            <label for="vlucht">Vlucht:</label>
                            <select name="vlucht" id="vlucht">
                                <option>1433ZZ</option>
                                <option>6456IU</option>
                                <option>9034FC</option>
                            </select>
                        </div>

                            <label for="naam">Naam:</label>

                        </div>

                        <div class="form-item">
                            <label for="geslacht">Geslacht:</label>
                            <input type="text" name="geslacht" id="geslacht">
                        </div>

                        <div class="form-item">
                            <label for="stoel">Stoel:</label>
                            <input type="text" name="stoel" id="stoel">
                        </div>

                        <button class="btn btn-green" type="submit">Aanmaken</button>

                </div>

        <footer>
